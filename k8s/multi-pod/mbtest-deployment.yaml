apiVersion: apps/v1
kind: Deployment
metadata:
  name: mbtest-deployment
spec:
  selector:
    matchLabels:
      app: mbtest
  template:
    metadata:
      labels:
        app: mbtest
    spec:
      containers:
        - name: mbtest
          image: bbyars/mountebank:2.9.1
          ports:
            - containerPort: 2525
